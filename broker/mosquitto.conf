# ==========================================================
# Eclipse Mosquitto MQTT Broker Configuration
# Supports standard TCP (1883) & WebSockets (9001) for Mobile
# ==========================================================

# Standard MQTT Protocol (for Raspberry Pi, ESP32, Python)
listener 1883
protocol mqtt
allow_anonymous true

# WebSockets Protocol (required for React Native & Web apps)
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
